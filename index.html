<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101521"><title>InterStory</title><link rel="stylesheet" href="styles.css"><script defer src="app.js?v=20261126-7"></script><style>#game{max-width:1000px;margin:32px auto;display:grid;gap:18px}#game .narrative,#game form,#game details{background:#151e2c;border:1px solid #344156;border-radius:12px;padding:22px}#game form{display:grid;gap:12px}#game button{justify-self:start}#game textarea{min-height:100px}#game select[multiple]{min-height:140px}#game pre{overflow-wrap:anywhere;white-space:pre-wrap}#game h2{margin:0}#game>textarea{width:100%}.decision-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:24px;padding:22px 0;border-bottom:1px solid #344156}.decision-context h3{margin-top:0;color:#e1c28a}.decision-context p,.decision-field small{color:#aab9ce;line-height:1.55}.decision-controls{display:grid;gap:14px}.decision-field{display:grid;gap:8px}.choice-tile{display:flex!important;align-items:flex-start;gap:12px;padding:12px;border:1px solid #344156;border-radius:8px;background:#101827;cursor:pointer}.choice-tile input{width:auto!important;flex:none;margin-top:4px;accent-color:#d9b673}.choice-tile:has(input:checked){border-color:#d9b673;background:#292a26}.choice-tile small{display:block;font-weight:normal;margin-top:5px}.allocation-counter{display:block;color:#d9b673}.over-budget{color:#ff7777}@media(max-width:650px){.decision-card{grid-template-columns:1fr;gap:12px}#game form{padding:12px}}</style></head>
